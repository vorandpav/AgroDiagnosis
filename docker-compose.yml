include:
  - observability/compose.yaml

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - agrodiagnosis-network

  inference-worker:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "src.inference_worker"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agrodiagnosis}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-agrodiagnosis-plant-disease}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      TASK_STORAGE_DIR: /data
      TASK_QUEUE: ${TASK_QUEUE:-agrodiagnosis.inference.v1}
      EVALUATE_TASK_QUEUE: ${EVALUATE_TASK_QUEUE:-agrodiagnosis.evaluate.v1}
      TASK_QUEUE_MAX_LENGTH: ${TASK_QUEUE_MAX_LENGTH:-100}
      TASK_QUEUE_SOFT_LIMIT: ${TASK_QUEUE_SOFT_LIMIT:-60}
      INFERENCE_MIN_SECONDS: ${INFERENCE_MIN_SECONDS:-1.0}
      TASK_MAX_DELIVERY_ATTEMPTS: ${TASK_MAX_DELIVERY_ATTEMPTS:-3}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8001}
      WORKER_EXECUTOR_WORKERS: ${WORKER_EXECUTOR_WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: agrodiagnosis-worker
      OTEL_RESOURCE_ATTRIBUTES: "service.version=${VERSION:-0.1.0},deployment.environment.name=${ENVIRONMENT:-development},service.instance.id=${WORKER_INSTANCE_ID:-inference-worker}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_BSP_EXPORT_TIMEOUT: "2000"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-8001}:${WORKER_HEALTH_PORT:-8001}"
    volumes:
      - ./task-data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['WORKER_HEALTH_PORT'] + '/healthz', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    networks:
      - agrodiagnosis-network

  postgres:
    image: postgres:16-alpine
    container_name: agrodiagnosis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agrodiagnosis}
      TZ: ${TZ:-Europe/Moscow}
      PGTZ: ${TZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agrodiagnosis-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrodiagnosis-app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agrodiagnosis}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-agrodiagnosis-plant-disease}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      TASK_STORAGE_DIR: /data
      TASK_QUEUE: ${TASK_QUEUE:-agrodiagnosis.inference.v1}
      EVALUATE_TASK_QUEUE: ${EVALUATE_TASK_QUEUE:-agrodiagnosis.evaluate.v1}
      TASK_QUEUE_MAX_LENGTH: ${TASK_QUEUE_MAX_LENGTH:-100}
      TASK_QUEUE_SOFT_LIMIT: ${TASK_QUEUE_SOFT_LIMIT:-60}
      INFERENCE_MIN_SECONDS: ${INFERENCE_MIN_SECONDS:-1.0}
      WORKER_HEALTH_URL: http://inference-worker:${WORKER_HEALTH_PORT:-8001}/healthz
      OTEL_SERVICE_NAME: agrodiagnosis-api
      OTEL_RESOURCE_ATTRIBUTES: "service.version=${VERSION:-0.1.0},deployment.environment.name=${ENVIRONMENT:-development},service.instance.id=api"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_BSP_EXPORT_TIMEOUT: "2000"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    volumes:
      - ./task-data:/data
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inference-worker:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agrodiagnosis-network
    restart: unless-stopped

  source:
    profiles:
      - source
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - 'export OTEL_RESOURCE_ATTRIBUTES="service.version=${VERSION:-0.1.0},deployment.environment.name=${ENVIRONMENT:-development},service.instance.id=$${SOURCE_INSTANCE_ID:-$${HOSTNAME:-source}}"; exec uv run --no-sync python -m src.scripts.batch_publisher "$$@"'
      - batch_publisher
    command: []
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      TASK_QUEUE: ${TASK_QUEUE:-agrodiagnosis.inference.v1}
      EVALUATE_TASK_QUEUE: ${EVALUATE_TASK_QUEUE:-agrodiagnosis.evaluate.v1}
      TASK_QUEUE_MAX_LENGTH: ${TASK_QUEUE_MAX_LENGTH:-100}
      TASK_QUEUE_SOFT_LIMIT: ${TASK_QUEUE_SOFT_LIMIT:-60}
      PUBLISH_TIMEOUT_SECONDS: ${PUBLISH_TIMEOUT_SECONDS:-5.0}
      PUBLISH_RETRY_DELAY_SECONDS: ${PUBLISH_RETRY_DELAY_SECONDS:-0.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: agrodiagnosis-source
      SOURCE_INSTANCE_ID: ${SOURCE_INSTANCE_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_BSP_EXPORT_TIMEOUT: "2000"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    volumes:
      - ./task-data:/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - agrodiagnosis-network

volumes:
  rabbitmq-data:
  postgres-data:

networks:
  agrodiagnosis-network:
    driver: bridge

configs:
  rabbitmq_enabled_plugins:
    content: "[rabbitmq_management,rabbitmq_prometheus].\n"
