[project]
name = "agrodiagnosis"
version = "0.1.0"
description = "Agricultural crop disease diagnostics platform."
readme = "README.md"
authors = [
    { name = "vorobev andrej", email = "vorandpav@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "N", # pep8-naming
    "RUF", # ruff-specific
    "BLE", # flake8-blind-except
    "ANN", # flake8-annotations
]
ignore = [
    "RUF001", # cyrillic identifiers
    "RUF002", # cyrillic docstrings
    "RUF003", # cyrillic comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"] # ignore missing type annotations in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
