# Log storage starts only with --profile logs or --profile observability.
services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    profiles: ["logs", "observability"]
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=3d
      - -httpListenAddr=:9428
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - victorialogs-data:/victoria-logs-data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/victoria-logs-prod", "-healthcheck", "-httpListenAddr=:9428"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - agrodiagnosis-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: ["logs", "traces", "metrics", "observability"]
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-agrodiagnosis}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    mem_limit: 256m
    healthcheck:
      # Distroless image: no wget/curl. Binary --version mirrors Tempo's check;
      # HTTP readiness lives on the in-process health_check extension :13133.
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agrodiagnosis-network

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.128.0
    profiles: ["metrics", "observability"]
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=3d
      - -httpListenAddr=:8428
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - agrodiagnosis-network

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["traces", "observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 384m
    healthcheck:
      # 2.8.2 is distroless and has no --health flag. -version is the binary check;
      # readiness is http://127.0.0.1:3200/ready.
      test: ["CMD", "/tempo", "-version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - agrodiagnosis-network

  grafana:
    build:
      context: ./grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-agrodiagnosis}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_PLUGINS: /usr/share/grafana/plugins-bundled
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_INSTALL_PLUGINS: ""
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: info
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - agrodiagnosis-network

volumes:
  victorialogs-data:
  victoriametrics-data:
  tempo-data:
  grafana-data:

networks:
  agrodiagnosis-network:
    driver: bridge
