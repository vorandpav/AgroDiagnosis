[project]
name = "agrodiagnosis-training"
version = "0.1.0"
description = "EDA, training and MLflow experiments for AgroDiagnosis."
readme = "README.md"
authors = [
    { name = "vorobev andrej", email = "vorandpav@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "kagglehub>=0.3.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=12.3.0",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
